{% extends "base.html" %}
{% block title %}— Inscription{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">

    <div class="flex flex-col items-center mb-8">
      <svg width="56" height="56" viewBox="0 0 26 26" fill="none" class="mb-3">
        <circle cx="13" cy="13" r="13" fill="#0d2e1a"/>
        <circle cx="13" cy="13" r="13" fill="url(#gin)" opacity="0.85"/>
        <defs>
          <radialGradient id="gin" cx="35%" cy="30%" r="75%">
            <stop offset="0%"   stop-color="#3de88a"/>
            <stop offset="60%"  stop-color="#0a7a4a"/>
            <stop offset="100%" stop-color="#0d2e40"/>
          </radialGradient>
        </defs>
        <text x="13" y="17.5" text-anchor="middle"
              font-family="Arial" font-weight="700"
              font-size="13" fill="white">A</text>
        <circle cx="19" cy="7" r="2" fill="#7fffc0" opacity="0.9"/>
      </svg>
      <h1 class="text-2xl font-bold text-white">Créer un compte</h1>
      <p class="text-gray-400 text-sm mt-1">
        Rejoignez la communauté Agora
      </p>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">
      <form method="POST" action="{{ url_for('inscription') }}"
            enctype="multipart/form-data"
            class="flex flex-col gap-5">

        <div class="flex flex-col items-center gap-2">
          <div class="w-16 h-16 rounded-full bg-gray-800
                      border-2 border-dashed border-gray-600
                      flex items-center justify-center cursor-pointer
                      hover:border-green-600 transition"
               onclick="document.getElementById('photo').click()">
            <i class="ti ti-camera text-2xl text-gray-500"></i>
          </div>
          <input type="file" id="photo" name="photo_profil"
                 accept="image/*" class="hidden"/>
          <span class="text-xs text-gray-500">
            Photo de profil (optionnel)
          </span>
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Pseudo</label>
          <div class="flex items-center gap-2 bg-gray-800
                      border border-gray-700 rounded-lg px-3 py-2.5
                      focus-within:border-green-600">
            <i class="ti ti-at text-gray-500"></i>
            <input type="text" name="pseudo"
                   placeholder="votre_pseudo"
                   pattern="[a-zA-Z0-9_\-]{3,30}"
                   title="3 à 30 caractères : lettres, chiffres, _ et -"
                   required
                   class="bg-transparent flex-1 text-sm text-white
                          outline-none placeholder-gray-600"/>
          </div>
          <p class="text-xs text-gray-600 mt-1">
            Lettres, chiffres, _ et - uniquement (3 à 30 caractères)
          </p>
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-1.5">
            Adresse email
          </label>
          <div class="flex items-center gap-2 bg-gray-800
                      border border-gray-700 rounded-lg px-3 py-2.5
                      focus-within:border-green-600">
            <i class="ti ti-mail text-gray-500"></i>
            <input type="email" name="email"
                   placeholder="exemple@email.com"
                   required
                   class="bg-transparent flex-1 text-sm text-white
                          outline-none placeholder-gray-600"/>
          </div>
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-1.5">
            Mot de passe
          </label>
          <div class="flex items-center gap-2 bg-gray-800
                      border border-gray-700 rounded-lg px-3 py-2.5
                      focus-within:border-green-600">
            <i class="ti ti-lock text-gray-500"></i>
            <input type="password" name="mot_de_passe"
                   placeholder="••••••••"
                   minlength="6"
                   required
                   class="bg-transparent flex-1 text-sm text-white
                          outline-none placeholder-gray-600"/>
          </div>
          <p class="text-xs text-gray-600 mt-1">
            Minimum 6 caractères
          </p>
        </div>

        <button type="submit"
                class="w-full bg-gradient-to-r from-agora-green
                       to-teal-700 text-white font-semibold py-2.5
                       rounded-lg hover:opacity-90 transition text-sm mt-1">
          Créer mon compte
        </button>

      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        Déjà un compte ?
        <a href="{{ url_for('connexion') }}"
           class="text-green-400 hover:underline">
          Se connecter
        </a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
